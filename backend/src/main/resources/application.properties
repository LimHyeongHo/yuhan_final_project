# 공통 설정: 비밀값은 저장하지 않고 환경변수에서 주입한다.
spring.application.name=yuhan-final-project
server.port=${PORT:8080}

# JPA 공통 설정
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.show_sql=${JPA_SHOW_SQL:false}

# PostgreSQL 번역기 전용 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 네이버 쇼핑 API
naver.client.id=${NAVER_CLIENT_ID}
naver.client.secret=${NAVER_CLIENT_SECRET}

# 알라딘 도서 API
aladin.ttb.key=${ALADIN_TTB_KEY}
aladin.api.url=https://www.aladin.co.kr/ttb/api/ItemLookUp.aspx

# Blockchain Configuration (sepolia update) [9/4일 업데이트] 
blockchain.url=${BLOCKCHAIN_URL}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS}


# 업로드 용량 제한 (채팅/상품 이미지 5MB 기준)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 배포 URL/CORS
app.frontend-url=${FRONTEND_ORIGIN:http://localhost:3000}
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
app.public-base-url=${BACKEND_PUBLIC_URL:http://localhost:8080}

# 상태 확인 엔드포인트
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
