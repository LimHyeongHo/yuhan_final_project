# application.properties (공통 설정 및 환경변수 매핑)
spring.application.name=yuhan-final-project
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.show_sql=${JPA_SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# PKI / Payment / Identity Verification
pki.server-secret=${PKI_SERVER_SECRET}
toss.secret-key=${TOSS_SECRET_KEY}
portone.api-secret=${PORTONE_API_SECRET}
portone.api.base-url=${PORTONE_API_BASE_URL:https://api.portone.io}

# Search APIs
naver.client.id=${NAVER_CLIENT_ID:}
naver.client.secret=${NAVER_CLIENT_SECRET:}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
google.books-api-key=${GOOGLE_BOOKS_API_KEY:}

# Blockchain
blockchain.url=${BLOCKCHAIN_URL}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS}


# 업로드 용량 제한 (채팅/상품 이미지 5MB 기준)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 배포 URL/CORS
app.frontend-url=${FRONTEND_ORIGIN:http://localhost:3000}
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
app.public-base-url=${BACKEND_PUBLIC_URL:http://localhost:8080}

# 상태 확인 엔드포인트
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
