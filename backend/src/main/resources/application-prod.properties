spring.datasource.url=${DB_URL:jdbc:${DATABASE_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

pki.server-secret=${PKI_SERVER_SECRET}
toss.secret-key=${TOSS_SECRET_KEY}
portone.api-secret=${PORTONE_API_SECRET}
portone.api.base-url=${PORTONE_API_BASE_URL:https://api.portone.io}

server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
